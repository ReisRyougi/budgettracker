<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Budget Tracker">
    <meta property="og:description" content="Track your budget free and simple">
    <link rel="stylesheet" href="style.css">
    <title>Budget</title>
</head>
<body>
    <header>
        <h1>Budget Tracker by Oleg</h1>
        <nav class="tabswitch">
            <button id="balanceBtn" class="active" disabled>Balance</button>
            <button id="transactionsBtn">Transactions</button>
        </nav>
    </header>
    
    <main>
        <section id="balance" class="active">
            <div id="chartContainer">
                <div id="emptyChart">No wallets added</div>
                <canvas id="walletChart" width="600" height="600" style="display: none;"></canvas>
            </div>
            <button id="addWalletBtn">Add Wallet</button>
            <div id="walletList">
                
            </div>
        </section>
        <section id="transactions">
            <button id="addTransactionBtn">Add Transaction</button>
            <div id="transactionList"></div>
        </section>
    </main>

    <div id="overlay">
        <div id="addWalletModal">
            <button type="button" id="closeModalBtn">✕</button>
            <h3>Add your wallet:</h3>
            <form id="addWalletForm">
                <p>
                    <label for="newWalletName">Wallet name:</label>
                    <input type="text" id="newWalletName">
                </p>
                <p>
                    <input type="radio" name="type" id="newWalletTypeFiat" value="fiat" checked>
                    <label for="newWalletTypeFiat">Fiat</label>
                    <input type="radio" name="type" id="newWalletTypeCrypto" value="crypto">
                    <label for="newWalletTypeCrypto">Crypto</label>
                </p>
                <div id="fiatFields">
                    <label for="initialBalance">Initial balance:</label>
                    <input type="number" id="initialBalance" min="0" step="0.01">
                </div>

                <div id="cryptoFields" style="display: none;">
                    <label for="coinSelect">Coin:</label>
                    <select id="coinSelect">
                        <option value="bitcoin">Bitcoin (BTC)</option>
                        <option value="ethereum">Ethereum (ETH)</option>
                        <option value="solana">Solana (SOL)</option>
                        <option value="cardano">Cardano (ADA)</option>
                        <option value="monero">Monero (XMR)</option>
                    </select>
                    <label for="coinAmount">Amount owned:</label>
                    <input type="number" id="coinAmount" min="0" step="any">
                </div>

                <div id="colorPicker">
                    <div class="colorOption" data-color="#e74c3c" style="background: #e74c3c;"></div>
                    <div class="colorOption" data-color="#3498db" style="background: #3498db;"></div>
                    <div class="colorOption" data-color="#2ecc71" style="background: #2ecc71;"></div>
                    <div class="colorOption" data-color="#f39c12" style="background: #f39c12;"></div>
                    <div class="colorOption" data-color="#9b59b6" style="background: #9b59b6;"></div>
                    <div class="colorOption" data-color="#1abc9c" style="background: #1abc9c;"></div>
                    <div class="colorOption" data-color="#e67e22" style="background: #e67e22;"></div>
                    <div class="colorOption" data-color="#e91e63" style="background: #e91e63;"></div>
                    <div class="colorOption" data-color="#00bcd4" style="background: #00bcd4;"></div>
                    <div class="colorOption" data-color="#8bc34a" style="background: #8bc34a;"></div>
                </div>

                <input type="hidden" id="selectedColor" value="">
                <button type="submit">Add Wallet</button>
            </form>
        </div>
        <div id="transactionModal">

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
