<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Budget Tracker">
    <meta property="og:description" content="Track your budget free and simple">
    <link rel="stylesheet" href="style.css">
    <title>Budget</title>
</head>
<body>
    <header>
        <h1>Budget Tracker by Reis</h1>
        <nav class="tabswitch">
            <button id="balanceBtn" class="active" disabled>Balance</button>
            <button id="transactionsBtn">Transactions</button>
        </nav>
    </header>
    <main>
        <section id="balance" class="active">
            <div id="chartContainer">
                <div id="emptyChart">No wallets added</div>
            </div>
            <button id="addWalletBtn">Add Wallet</button>
            <div id="walletList"></div>
        </section>
        <section id="transactions">test2</section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
